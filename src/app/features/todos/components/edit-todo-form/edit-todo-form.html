@let editMode = isEditMode();
<form
  class="edit-todo-form"
  #editForm="ngForm"
  (ngSubmit)="save()"
>
  <h2>{{ title() }} </h2>
  <div>
    <span>Статус задачи</span>
    <mat-checkbox
      name="status"
      [disabled]="!editMode"
      [(ngModel)]="dataToSave().status"
    />
  </div>

  <mat-form-field class="example-full-width">
    <mat-label>Название</mat-label>
    <input
      matInput
      name="title"
      [disabled]="!editMode"
      [(ngModel)]="dataToSave().title"
    >
  </mat-form-field>
  <mat-form-field class="example-full-width">
    <mat-label>Описание</mat-label>
    <textarea
      matInput
      name="description"
      [disabled]="!editMode"
      required
      minlength="5"
      [(ngModel)]="dataToSave().description"
    ></textarea>
  </mat-form-field>
  @if (editMode && editForm) {
  <div class="edit-todo-form__actions">
    <app-button
      btn-title="Сохранить"
      type="submit"
      [isDisabled]="isSaveDisabled"
      [appTooltip]="'Сохранить задачу'"
    />
  </div>
  }
</form>
